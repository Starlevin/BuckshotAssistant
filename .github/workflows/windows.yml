name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Build and test
        shell: pwsh
        run: ./build.ps1
      - name: Packaged sidebar smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./dist/BuckshotAssistant/BuckshotAssistant.exe -ArgumentList '--smoke-test','--sidebar' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: BuckshotAssistant-Windows
          path: dist/BuckshotAssistant/
